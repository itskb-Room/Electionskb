<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การเลือกตั้งคณะกรรมการสวัสดิการในสถานประกอบการ</title>
<style>
  :root{--green:#0b6b4f;--blue:#075eaa}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Tahoma,sans-serif;background:#eef6fb;color:#16324f}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
       background:linear-gradient(135deg,var(--blue),#11a874);color:#fff;padding:10px 16px}
  .bar .t{font-weight:bold;line-height:1.2}
  .bar .t small{display:block;font-weight:400;opacity:.9;font-size:12px}
  .bar a{color:#fff;background:#ffffff33;border:1px solid #ffffff55;border-radius:8px;
         padding:7px 12px;text-decoration:none;font-size:13px;white-space:nowrap}
  .wrap{position:absolute;top:56px;left:0;right:0;bottom:0}
  iframe{width:100%;height:100%;border:0;display:block;background:#f4f8fb}
  .fallback{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
            align-items:center;justify-content:center;text-align:center;padding:24px;color:#4b6075}
  .fallback a{background:var(--blue);color:#fff;padding:14px 22px;border-radius:12px;
              text-decoration:none;font-weight:bold;font-size:16px}
  @media(max-width:520px){.bar .t{font-size:14px}}
</style>
</head>
<body>
  <!-- ========================================================= -->
  <!--  แก้ลิงก์ตรงนี้ให้เป็น URL เว็บแอป Apps Script ของคุณ (/exec)  -->
  <!--  ดูได้จาก Apps Script > Deploy > Manage deployments         -->
  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbxWgEabbbAk4HuaQI6SF9pEWzXZRah2BtriZR4r6Se02mYFuFwMWST9HGR3tYl14H4uoA/exec";
  </script>
  <!-- ========================================================= -->

  <div class="bar">
    <div class="t">การเลือกตั้งคณะกรรมการสวัสดิการในสถานประกอบการ
      <small>บริษัท สงขลาไบโอ แมส จำกัด</small>
    </div>
    <a id="openFull" href="#" target="_blank" rel="noopener">เปิดเต็มหน้าจอ ↗</a>
  </div>

  <div class="wrap">
    <iframe id="app" title="หน้าลงคะแนน"></iframe>
    <div class="fallback" id="fallback" style="display:none">
      <div>ไม่สามารถแสดงหน้าลงคะแนนแบบฝังได้<br>กรุณากดปุ่มด้านล่างเพื่อเปิดหน้าลงคะแนนโดยตรง</div>
      <a id="openDirect" href="#" target="_blank" rel="noopener">▶ เปิดหน้าลงคะแนน</a>
    </div>
  </div>

<script>
  var voteUrl = APP_URL + (APP_URL.indexOf('?')>-1 ? '&' : '?') + 'page=vote';
  document.getElementById('app').src = voteUrl;
  document.getElementById('openFull').href = voteUrl;
  document.getElementById('openDirect').href = voteUrl;

  // ถ้าฝังไม่ขึ้นภายใน 6 วินาที ให้โชว์ปุ่มเปิดโดยตรงเป็นทางสำรอง
  var loaded = false;
  document.getElementById('app').addEventListener('load', function(){ loaded = true; });
  setTimeout(function(){
    if(!loaded){
      document.getElementById('app').style.display='none';
      document.getElementById('fallback').style.display='flex';
    }
  }, 6000);
</script>
</body>
</html>
